<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inner Match</title>
<meta name="description" content="Inner Match – der Tennis-Adventskalender für mentale Stärke. 24 Türen, kostenlos, ohne Anmeldung.">
<meta name="theme-color" content="#C4552D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inner Match">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Barlow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="top">
  <div class="brand"><span class="ball-dot" aria-hidden="true"></span><span>Inner Match</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabCal" aria-selected="true" data-view="cal"></button>
    <button role="tab" id="tabCab" aria-selected="false" data-view="cab"></button>
  </nav>
  <div class="ctrl">
    <button id="soundBtn" class="pill" aria-pressed="true"></button>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button data-lang="de">DE</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <section id="viewCal" class="view">
    <div class="hero">
      <h1>Inner <span>Match</span></h1>
      <p class="tagline" data-ui="tagline"></p>
      <p class="intro" data-ui="intro"></p>
    </div>
    <div class="net" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="court"><div class="grid" id="grid"></div></div>
    <div class="basket"><span data-ui="basket"></span> <b id="basketCount">0 / 25</b><div class="balls" id="balls" aria-hidden="true"></div></div>
    <button id="installBtn" class="pill install" hidden data-ui="install"></button>
    <p id="iosHint" class="note" hidden data-ui="installIos"></p>
  </section>

  <section id="viewCab" class="view" hidden>
    <h2 class="cab-title" data-ui="cabinet"></h2>
    <p class="intro" data-ui="cabinetIntro"></p>
    <h3 class="sec" data-ui="trophies"></h3>
    <div class="trophies" id="trophies"></div>
    <h3 class="sec" data-ui="tourDay"></h3>
    <div class="tourday" id="tourday"></div>
    <h3 class="sec" data-ui="learnings"></h3>
    <ol class="learnings" id="learnings"></ol>
    <div class="cab-actions">
      <button id="pdfBtn" class="btn" data-ui="pdf"></button>
      <p class="note" data-ui="privacy"></p>
    </div>
  </section>

  <footer>
    <span data-ui="f1"></span>
    <span data-ui="f2"></span>
    <label class="preview" id="previewWrap" hidden><input type="checkbox" id="preview"> <span data-ui="preview"></span></label>
  </footer>
</main>

<div id="stage" class="stage" hidden>
  <div class="door-anim" id="doorAnim" aria-hidden="true">
    <div class="leaf"><span id="leafNum">1</span></div>
    <div class="ball-drop"></div>
  </div>
  <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="card-head">
      <div class="ballnum" id="dNum">1</div>
      <div><div class="eyebrow" id="dDate"></div><h2 id="dTitle"></h2></div>
    </div>
    <div class="card-body">
      <p class="umpire"><span class="eyebrow" data-ui="umpire"></span><span id="dUmpire"></span></p>
      <div class="text" id="dText"></div>
      <div class="quote" id="dQuote"></div>
      <figure class="voice" id="dVoice" hidden>
        <div class="eyebrow" data-ui="voice"></div>
        <blockquote id="dVoiceQ"></blockquote>
        <p class="tr" id="dVoiceTr"></p>
        <figcaption id="dVoiceWho"></figcaption>
      </figure>
      <div class="journal">
        <p class="q" id="dQ"></p>
        <p class="note" id="dJournalHint"></p>
        <div id="fields"></div>
        <div class="saved" id="dSaved" aria-live="polite"></div>
      </div>
      <div class="place">
        <div class="eyebrow" data-ui="placeEyebrow"></div>
        <div class="name" id="dPlace"></div>
        <p data-ui="placeQ"></p>
      </div>
      <div class="teaser" id="dTeaser" hidden>
        <div class="eyebrow" data-ui="teaserEyebrow"></div>
        <strong id="dTeaserHead"></strong>
        <span id="dTeaserText"></span>
        <a class="btn ballbtn" id="teaserLink" target="_blank" rel="noopener" data-ui="teaserBtn"></a>
      </div>
      <button class="btn ghost" id="closeBtn" data-ui="close"></button>
    </div>
  </article>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
