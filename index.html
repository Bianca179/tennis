<meta charset="utf-8">

<title>Matchplan — Your Coaches</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0e1726; --surface:#16223a; --surface-2:#1d2c49; --ink:#f4f7fb;
    --ink-2:#a9b6cc; --line:rgba(255,255,255,.10); --accent:#3d7dff; --accent-2:#2a78d6;
    --good:#22b573;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:520px;margin:0 auto;min-height:100vh;
    padding:calc(env(safe-area-inset-top,0) + 22px) 18px calc(env(safe-area-inset-bottom,0) + 28px)}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
  h2{font-size:1.2rem;margin:0 0 14px}
  p.sub{color:var(--ink-2);margin:0 0 20px;line-height:1.5}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 22px;border:none;border-radius:999px;font-size:1rem;font-weight:600;
    cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;width:100%}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:1rem;font-family:inherit}
  input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  label{display:block;font-size:.85rem;color:var(--ink-2);margin:14px 0 6px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  /* Hub tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:16px;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;
    gap:8px;min-height:120px;transition:transform .08s,border-color .12s}
  .tile:active{transform:scale(.98)}
  .tile:hover{border-color:var(--accent)}
  .tile .ic{font-size:1.9rem}
  .tile .nm{font-weight:700}
  .tile .tg{font-size:.82rem;color:var(--ink-2);line-height:1.35}
  .tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0}
  .tile.wide .ic{font-size:1.6rem}
  .tile.soon{opacity:.6}
  .badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;align-self:flex-start}
  .badge.soon{color:var(--ink-2);border-color:var(--line)}
  .badge.on{color:var(--good);border-color:var(--good)}
  .trialbar{font-size:.8rem;color:var(--ink-2);margin-top:18px;text-align:center}
  /* Chat */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .topbar button{background:none;border:none;color:var(--ink-2);font-size:1.4rem;cursor:pointer;padding:4px}
  .log{display:flex;flex-direction:column;gap:8px;padding:4px 0 96px}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:.95rem;overflow-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.typing{color:var(--ink-2)}
  .msg-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.8rem;font-family:inherit;cursor:pointer}
  .inrow .btn.mic{padding:14px 14px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .inrow .btn.mic.rec{background:#d93a3a;border-color:transparent;color:#fff;animation:micpulse 1.2s ease-in-out infinite}
  @keyframes micpulse{50%{opacity:.6}}
  .guide{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + 18px) 20px calc(env(safe-area-inset-bottom,0) + 20px);max-width:520px;margin:0 auto}
  .guide-top{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);font-size:.9rem}
  .g-x{background:none;border:none;color:var(--ink-2);font-size:1.3rem;cursor:pointer}
  .g-step{flex:1;display:flex;align-items:center;font-size:1.6rem;line-height:1.35;font-weight:600}
  .g-timer{font-size:3.2rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;min-height:4rem}
  .g-nav{display:flex;gap:10px;margin-top:16px}
  .g-nav .btn{flex:1;padding:18px 8px}
  .inrow{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
    display:flex;gap:8px;padding:10px 18px calc(env(safe-area-inset-bottom,0) + 12px);
    background:linear-gradient(transparent,var(--bg) 22%)}
  .inrow textarea{flex:1;resize:none}
  .inrow .btn{width:auto;padding:14px 18px}
  .steps{color:var(--ink-2);font-size:.8rem;margin-bottom:10px}
  .center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
  .price{display:flex;gap:10px;margin-top:14px}
  .price .card{flex:1;text-align:center}
  .price .amt{font-size:1.4rem;font-weight:800;margin:4px 0}
  a.plain{color:var(--accent);text-decoration:none}
  .picks{display:flex;flex-direction:column;gap:10px;margin:16px 0 18px;text-align:left}
  .pick{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
  .pick:hover{border-color:var(--accent)}
  .pick input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
  .consent{display:flex;gap:10px;align-items:flex-start;margin:14px 0 10px;font-size:.8rem;color:var(--ink-2);line-height:1.4;cursor:pointer}
  .consent input{width:18px;height:18px;flex:0 0 auto;margin-top:1px;accent-color:var(--accent);padding:0}
  .consent a,.legal a,p.sub a{color:var(--ink)}
  .legal{text-align:center;font-size:.72rem;color:var(--ink-2);margin-top:14px}
  .pick.bundle{border-color:rgba(61,125,255,.45);background:rgba(61,125,255,.07)}
  .pk-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .pk-name{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pk-tag{font-size:.8rem;color:var(--ink-2)}
  .pk-price{font-weight:700;white-space:nowrap}
  .hidden{display:none}
  .langsw{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px}
  .langsw button{font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:5px 9px;border-radius:999px;
    border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer}
  .langsw button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
</style>

  // ---------- Voice: speak to the coach, hear the answer, guided sessions ----------
  // Speech-to-text runs on the server (OpenAI) when it is configured; otherwise the browser's own
  // recognizer is used where it exists. Read-aloud uses the phone's built-in voice (free).
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var VOICE_LANG = { en:"en-US", de:"de-DE", fr:"fr-FR" };
  var voice = {
    serverOn:false, unlocked:false,
    hasRecorder:function(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
    canListen:function(){ return voice.hasRecorder() || !!SR; },
    // iOS only allows read-aloud after it was started once by a tap.
    unlock:function(){
      if(!("speechSynthesis" in window) || voice.unlocked) return;
      try{ speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); voice.unlocked = true; }catch(e){}
    },
    clean:function(text){
      return String(text||"").replace(/\*\*|__|`|#+\s/g,"")
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").replace(/\s+/g," ").trim();
    },
    speak:function(text, onEnd){
      if(!("speechSynthesis" in window)){ if(onEnd) onEnd(); return; }
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(voice.clean(text)), lang = VOICE_LANG[LANG] || "en-US";
      u.lang = lang;
      var v = speechSynthesis.getVoices().filter(function(x){ return x.lang && x.lang.replace("_","-").indexOf(lang)===0; })[0];
      if(v) u.voice = v;
      if(onEnd){ u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
    },
    stop:function(){ if("speechSynthesis" in window) speechSynthesis.cancel(); },
    record:function(){
      return navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
        var mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].filter(function(x){
          return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x); })[0] || "";
        var rec = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined), chunks = [];
        rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
        var done = new Promise(function(resolve){
          rec.onstop = function(){
            stream.getTracks().forEach(function(tr){ tr.stop(); });
            resolve(new Blob(chunks, { type: rec.mimeType || mime || "audio/mp4" }));
          };
        });
        rec.start();
        var timer = setTimeout(function(){ if(rec.state==="recording") rec.stop(); }, 60000);
        return { stop:function(){ clearTimeout(timer); if(rec.state==="recording") rec.stop(); return done; } };
      });
    },
    transcribe:function(blob){
      return new Promise(function(resolve, reject){
        var r = new FileReader();
        r.onload = function(){ resolve(String(r.result).split(",")[1] || ""); };
        r.onerror = reject; r.readAsDataURL(blob);
      }).then(function(b64){
        return fetch(CFG.transcribeUrl,{ method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ audio:b64, mime:blob.type, lang:LANG }) });
      }).then(function(res){
        if(!res.ok) throw new Error("http");
        return res.json();
      }).then(function(d){ return String(d.text||"").trim(); });
    }
  };
  try{ fetch(CFG.transcribeUrl).then(function(r){ return r.json(); })
    .then(function(d){ voice.serverOn = !!(d && d.enabled); }).catch(function(){}); }catch(e){}

  // Splits a coach answer into exercise steps (numbered lines, else bullets) with durations
  // like "30 sec", "45 seconds each side" or "2 min".
  function parseSteps(text){
    var lines = String(text||"").split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    var numbered = lines.some(function(l){ return /^\d+[.)]\s+/.test(l); });
    var re = numbered ? /^(\d+[.)])\s+(.*)$/ : /^([-•*–])\s+(.*)$/;
    var steps = [];
    lines.forEach(function(l){
      var m = l.match(re); if(!m) return;
      var body = m[2].replace(/\*\*|__/g,"").trim(); if(!body) return;
      var secs = 0, tm = body.match(/(\d+(?:[.,]\d+)?)\s*(?:-|–|to)?\s*(?:\d+\s*)?(s|sec|secs|second|seconds|sek|sekunden|min|mins|minute|minutes|minuten)\b/i);
      if(tm){
        var n = parseFloat(tm[1].replace(",","."));
        secs = /^m/i.test(tm[2]) ? Math.round(n*60) : Math.round(n);
        if(/each side|per side|each leg|per leg|each arm|per arm|pro seite|je seite|chaque côté/i.test(body)) secs *= 2;
        if(secs > 1800) secs = 0;
      }
      steps.push({ text:body, secs:secs });
    });
    return steps;
  }

  // Guided mode: one step per screen, read aloud, with a timer. Timed steps advance by themselves.
  function openGuide(steps, coachName){
    var i = 0, left = 0, tick = null, paused = false, wake = null;
    var ov = el('<div class="guide" role="dialog" aria-modal="true">'+
      '<div class="guide-top"><span class="g-count"></span><button class="g-x" aria-label="'+esc(t("gClose"))+'">✕</button></div>'+
      '<div class="g-step"></div><div class="g-timer" aria-live="polite"></div>'+
      '<div class="g-nav"><button class="btn ghost g-prev">'+esc(t("gBack"))+'</button>'+
      '<button class="btn ghost g-pause">'+esc(t("gPause"))+'</button>'+
      '<button class="btn g-next">'+esc(t("gNext"))+'</button></div></div>');
    document.body.appendChild(ov);
    function q(sel){ return ov.querySelector(sel); }
    if(navigator.wakeLock && navigator.wakeLock.request){ navigator.wakeLock.request("screen").then(function(w){ wake = w; }).catch(function(){}); }
    function fmt(x){ return Math.floor(x/60)+":"+String(x%60).padStart(2,"0"); }
    function clear(){ if(tick){ clearInterval(tick); tick = null; } }
    function close(){ clear(); voice.stop(); if(wake){ try{ wake.release(); }catch(e){} } ov.remove(); }
    function startTimer(){
      clear();
      tick = setInterval(function(){
        if(paused) return;
        left -= 1; q(".g-timer").textContent = fmt(Math.max(left,0));
        if(left===3) voice.speak(t("gThree"));
        if(left<=0){ clear(); next(); }
      }, 1000);
    }
    function show(){
      clear();
      var st = steps[i];
      q(".g-count").textContent = t("stepOf",{i:i+1, n:steps.length});
      q(".g-step").textContent = st.text;
      q(".g-prev").disabled = i===0;
      q(".g-next").textContent = i===steps.length-1 ? t("gDone") : t("gNext");
      q(".g-pause").hidden = !st.secs; paused = false; q(".g-pause").textContent = t("gPause");
      left = st.secs; q(".g-timer").textContent = st.secs ? fmt(left) : "";
      // Announce first, then the clock runs; fallback in case the device never reports the end.
      var started = false;
      var go = function(){ if(started || steps[i]!==st || !st.secs) return; started = true; startTimer(); };
      voice.speak(st.text, go);
      setTimeout(go, 1500 + st.text.split(/\s+/).length*450);
    }
    function next(){
      if(i >= steps.length-1){
        clear(); voice.speak(t("gSaid"));
        q(".g-step").textContent = t("gFinished"); q(".g-timer").textContent = ""; q(".g-count").textContent = coachName;
        var b = el('<button class="btn">'+esc(t("gClose"))+'</button>');
        q(".g-nav").replaceChildren(b); b.addEventListener("click", close);
        return;
      }
      i += 1; show();
    }
    q(".g-x").addEventListener("click", close);
    q(".g-next").addEventListener("click", next);
    q(".g-prev").addEventListener("click", function(){ if(i>0){ i -= 1; show(); } });
    q(".g-pause").addEventListener("click", function(){
      paused = !paused; q(".g-pause").textContent = paused ? t("gResume") : t("gPause");
      if(paused) voice.stop();
    });
    voice.unlock(); show();
  }

  // ---------- Chat ----------
  function viewChat(k){
    rerender = function(){ viewChat(k); };
    var c = COACHES[k];
    var histKey = "cf_chat_"+k;
    var history = S.get(histKey, []);
    var wrap = el(
      '<div>'+
        '<div class="topbar"><button id="bk">‹</button><h2 style="margin:0">'+c.icon+' '+esc(c.name)+'</h2></div>'+
        '<p class="sub" style="font-size:.7rem;margin:-4px 0 8px">'+esc(t("chatNote"))+'</p>'+
        '<div class="log" id="log"></div>'+
        '<div class="inrow"><textarea id="in" rows="1" placeholder="'+esc(t("message",{name:c.name}))+'"></textarea>'+
        (voice.canListen() ? '<button class="btn ghost mic" id="mic" aria-label="'+esc(t("speakTo",{name:c.name}))+'">🎙️</button>' : '')+
        '<button class="btn" id="send" aria-label="'+esc(t("send"))+'">➤</button></div>'+
      '</div>');
    app.replaceChildren(wrap);
    var log = wrap.querySelector("#log"), input = wrap.querySelector("#in"), sendBtn = wrap.querySelector("#send");
    wrap.querySelector("#bk").addEventListener("click", viewHome);

    function render(){
      log.replaceChildren();
      if(!history.length){ log.appendChild(el('<div class="msg bot">'+esc(t(c.greetKey||"greetDefault"))+'</div>')); }
      history.forEach(function(m){
        var node = el('<div class="msg '+(m.role==="user"?"user":"bot")+'">'+esc(m.content).replace(/\n/g,"<br>")+'</div>');
        if(m.role!=="user" && !m.error){
          var tools = el('<div class="msg-tools"></div>');
          var hear = el('<button class="chip">'+esc(t("listen"))+'</button>');
          hear.addEventListener("click", function(){ voice.unlock(); voice.speak(m.content); });
          tools.appendChild(hear);
          var steps = parseSteps(m.content);
          if(steps.length >= 2){
            var g = el('<button class="chip">'+esc(t("startGuide"))+'</button>');
            g.addEventListener("click", function(){ openGuide(steps, c.name); });
            tools.appendChild(g);
          }
          node.appendChild(tools);
        }
        log.appendChild(node);
      });
      window.scrollTo(0, document.body.scrollHeight);
    }

    function send(spoken){
      var text = (input.value||"").trim();
      if(!text || sendBtn.disabled) return;
      if(!accessOk()) return viewPaywall();
      input.value = "";
      history.push({role:"user", content:text});
      S.set(histKey, history.slice(-40));
      render();
      var typing = el('<div class="msg bot typing">'+esc(t("typing",{name:c.name}))+'</div>');
      log.appendChild(typing); window.scrollTo(0,document.body.scrollHeight);
      sendBtn.disabled = true;
      fetch(CFG.chatUrl,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          coach:k,
          token:S.get("cf_token",""),
          email:S.get("cf_email",""),
          profile:S.get("cf_profile",null),
          lang:LANG,
          messages:history.filter(function(m){return !m.error;}).slice(-12).map(function(m){return {role:m.role,content:m.content};})
        })
      }).then(function(r){
        if(r.status===429) throw new Error("rate");
        if(!r.ok) throw new Error("http");
        return r.json();
      }).then(function(d){
        if(!d.text) throw new Error("empty");
        history.push({role:"assistant", content:d.text});
        if(spoken===true) voice.speak(d.text);
      }).catch(function(){
        history.push({role:"assistant", content:t("cantReach",{name:c.name}), error:true});
      }).then(function(){
        S.set(histKey, history.slice(-40)); sendBtn.disabled=false; render();
      });
    }
    sendBtn.addEventListener("click", function(){ voice.unlock(); send(false); });
    input.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(false); }});

    // Mic: tap to talk, tap again to send. Server transcription when available, else the browser's.
    var mic = wrap.querySelector("#mic"), recording = null, srRec = null, placeholder = input.placeholder;
    function micIdle(){ mic.classList.remove("rec"); mic.disabled = false; mic.textContent = "🎙️"; input.placeholder = placeholder; }
    function micBusy(){ mic.classList.add("rec"); mic.textContent = "⏹"; mic.setAttribute("aria-label", t("stopSend")); input.placeholder = t("listening"); }
    function micFail(key){ micIdle(); input.placeholder = t(key); setTimeout(function(){ input.placeholder = placeholder; }, 4000); }
    function useText(text){
      if(!text){ return micFail("micErr"); }
      input.value = text; send(true);
    }
    if(mic) mic.addEventListener("click", function(){
      voice.unlock(); voice.stop();
      if(!accessOk()) return viewPaywall();
      if(voice.serverOn && voice.hasRecorder()){
        if(!recording){
          voice.record().then(function(r){ recording = r; micBusy(); })
            .catch(function(){ micFail("micDenied"); });
          return;
        }
        var r = recording; recording = null;
        mic.classList.remove("rec"); mic.textContent = "…"; mic.disabled = true;
        r.stop().then(voice.transcribe).then(function(text){ micIdle(); useText(text); })
          .catch(function(){ micFail("micErr"); });
        return;
      }
      if(SR){
        if(srRec){ srRec.stop(); return; }
        var heard = "";
        srRec = new SR(); srRec.lang = VOICE_LANG[LANG] || "en-US"; srRec.interimResults = false; srRec.maxAlternatives = 1;
        srRec.onresult = function(e){ heard = (e.results[0] && e.results[0][0] && e.results[0][0].transcript) || ""; };
        srRec.onerror = function(e){ heard = ""; if(e.error==="not-allowed") micFail("micDenied"); };
        srRec.onend = function(){ srRec = null; micIdle(); if(heard) useText(heard.trim()); };
        try{ srRec.start(); micBusy(); }catch(e){ srRec = null; micFail("micErr"); }
        return;
      }
      micFail("micErr");
    });
    render();
  }

  route();
})();
</script>
