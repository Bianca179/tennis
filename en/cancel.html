<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cancel or withdraw — Matchplan</title>
<style>
  :root{--bg:#0e1726;--surface:#16223a;--ink:#f4f7fb;--ink-2:#a9b6cc;--line:rgba(255,255,255,.10);--accent:#3d7dff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
  main{max-width:680px;margin:0 auto;padding:28px 16px 48px}
  h1{font-size:1.5rem;margin:0 0 6px}
  h2{font-size:1.05rem;margin:26px 0 8px}
  p,li{color:var(--ink-2)}
  strong{color:var(--ink)}
  a{color:var(--accent)}
  .note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.88rem}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  nav{font-size:.85rem;margin-bottom:18px}
  nav a{margin-right:14px}
  label{display:block;font-size:.85rem;color:var(--ink-2);margin:14px 0 6px}
  input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;font-family:inherit}
  .opts label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;color:var(--ink);font-size:.95rem;cursor:pointer}
  .opts input{width:18px;height:18px;flex:0 0 auto;margin-top:2px}
  .btn{display:block;width:100%;margin-top:18px;padding:14px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
  .btn:disabled{opacity:.5}
  .err{color:#ff8a8a;font-size:.88rem;margin-top:10px}
  .hp{position:absolute;left:-9999px}
  dl{margin:0}dt{color:var(--ink-2);font-size:.8rem;margin-top:10px}dd{margin:2px 0 0;color:var(--ink)}
  @media print{nav,.btn,.note{display:none}body,main{background:#fff;color:#000}dd,strong{color:#000}}
</style>
</head>
<body>
<main>
<nav><a href="/">‹ Back to the app</a><a href="/en/imprint.html">Imprint</a><a href="/en/privacy.html">Privacy</a><a href="/en/terms.html">Terms</a><a href="/en/cancel.html">Cancel contracts here</a><a href="/en/cancel.html?art=widerruf">Withdraw from contract</a><a href="/impressum.html">Deutsch</a></nav>
<h1 id="titel">Cancel contracts here</h1>
<p id="intro">Cancel or withdraw from your Matchplan subscription here. You will immediately receive a confirmation of receipt by email.</p>

<form id="f" class="box" novalidate>
  <div class="opts" role="radiogroup" aria-label="Type of notice">
    <label><input type="radio" name="art" value="kuendigung" checked> <span><strong>Cancellation</strong><br><small>at the end of the current billing month</small></span></label>
    <label><input type="radio" name="art" value="ausserordentlich"> <span><strong>Termination for good cause</strong><br><small>with immediate effect</small></span></label>
    <label><input type="radio" name="art" value="widerruf"> <span><strong>Withdrawal</strong><br><small>within 14 days of the contract</small></span></label>
  </div>
  <label for="name">First and last name</label>
  <input id="name" autocomplete="name" maxlength="120" required>
  <label for="email">Email address you ordered with</label>
  <input id="email" type="email" autocomplete="email" maxlength="200" required>
  <label for="vertrag">Which plan?</label>
  <select id="vertrag">
    <option>Matchplan – 1 coach</option>
    <option>Matchplan – all three coaches</option>
    <option>Not sure</option>
  </select>
  <div id="zp">
    <label for="zeitpunkt">Effective when?</label>
    <select id="zeitpunkt">
      <option value="naechstmoeglich">As soon as possible</option>
      <option value="datum">On a specific date</option>
    </select>
    <input id="datum" type="date" style="margin-top:8px;display:none">
  </div>
  <div id="gr" style="display:none">
    <label for="grund">Reason</label>
    <textarea id="grund" rows="3" maxlength="1000"></textarea>
  </div>
  <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="err" id="err" style="display:none"></p>
  <button class="btn" id="weiter" type="submit">Continue</button>
</form>

<div id="pruef" class="box" style="display:none">
  <p><strong>Please check:</strong></p>
  <dl id="zus"></dl>
  <p class="err" id="err2" style="display:none"></p>
  <button class="btn" id="senden" type="button">Cancel now</button>
  <button class="btn ghost" id="zurueck" type="button">Back</button>
</div>

<div id="fertig" class="box" style="display:none">
  <p><strong>Received.</strong> <span id="mailhinweis"></span></p>
  <dl id="beleg"></dl>
  <button class="btn ghost" type="button" onclick="window.print()">Save or print confirmation</button>
</div>

<script>
(function(){
  var URL_ = 'https://aiva179.app.n8n.cloud/webhook/matchplan-vertrag';
  var $ = function(id){ return document.getElementById(id); };
  var TXT = {
    kuendigung: { t: 'Cancel contracts here', btn: 'Cancel now', name: 'Cancellation' },
    ausserordentlich: { t: 'Cancel contracts here', btn: 'Cancel now', name: 'Termination for good cause' },
    widerruf: { t: 'Withdraw from contract', btn: 'Confirm withdrawal', name: 'Withdrawal' }
  };
  var radios = document.querySelectorAll('input[name=art]');
  var start = new URLSearchParams(location.search).get('art');
  if (TXT[start]) radios.forEach(function(r){ r.checked = r.value === start; });
  function art(){ var v='kuendigung'; radios.forEach(function(r){ if(r.checked) v=r.value; }); return v; }
  function sync(){
    var a = art();
    $('titel').textContent = TXT[a].t;
    $('zp').style.display = a === 'kuendigung' ? '' : 'none';
    $('gr').style.display = a === 'ausserordentlich' ? '' : 'none';
    $('datum').style.display = (a === 'kuendigung' && $('zeitpunkt').value === 'datum') ? '' : 'none';
    $('senden').textContent = TXT[a].btn;
  }
  radios.forEach(function(r){ r.addEventListener('change', sync); });
  $('zeitpunkt').addEventListener('change', sync);
  sync();

  function daten(){
    var a = art(), zp = '';
    if (a === 'kuendigung') zp = $('zeitpunkt').value === 'datum' && $('datum').value
      ? new Date($('datum').value + 'T12:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'naechstmoeglich';
    return { art: a, name: $('name').value.trim(), email: $('email').value.trim(), vertrag: $('vertrag').value,
      zeitpunkt: zp, grund: a === 'ausserordentlich' ? $('grund').value.trim() : '', website: $('website').value, lang: 'en' };
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function liste(paare){ return paare.filter(function(p){ return p[1]; }).map(function(p){ return '<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>'; }).join(''); }

  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    var d = daten(), err = '';
    if (d.name.length < 2) err = 'Please enter your name.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) err = 'Please enter a valid email address.';
    else if (d.art === 'ausserordentlich' && d.grund.length < 3) err = 'Please state the reason.';
    else if (d.art === 'kuendigung' && $('zeitpunkt').value === 'datum' && !$('datum').value) err = 'Please choose a date.';
    $('err').textContent = err; $('err').style.display = err ? '' : 'none';
    if (err) return;
    $('zus').innerHTML = liste([['Type', TXT[d.art].name], ['Name', d.name], ['Email', d.email], ['Plan', d.vertrag],
      ['Effective', d.art === 'kuendigung' ? (d.zeitpunkt === 'naechstmoeglich' ? 'as soon as possible' : d.zeitpunkt) : 'immediately'], ['Reason', d.grund]]);
    $('f').style.display = 'none'; $('pruef').style.display = ''; window.scrollTo(0, 0);
  });
  $('zurueck').addEventListener('click', function(){ $('pruef').style.display = 'none'; $('f').style.display = ''; });
  $('senden').addEventListener('click', function(){
    var b = $('senden'); b.disabled = true; b.textContent = 'Sending …'; $('err2').style.display = 'none';
    fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(daten()) })
      .then(function(r){ return r.json(); })
      .then(function(r){
        if (!r || !r.ok) throw new Error('fehler');
        var d = daten();
        $('beleg').innerHTML = liste([['Type', r.art], ['Name', d.name], ['Email', d.email], ['Plan', d.vertrag], ['Ends', r.ende], ['Reason', d.grund], ['Received', r.eingang], ['Reference', r.ref]]);
        $('mailhinweis').textContent = r.mail ? 'Your confirmation is on its way by email.' : 'The confirmation email could not be sent right now. Your notice has still been received – please save this page.';
        $('pruef').style.display = 'none'; $('fertig').style.display = ''; $('intro').style.display = 'none'; window.scrollTo(0, 0);
      })
      .catch(function(){
        b.disabled = false; sync();
        $('err2').textContent = 'That did not work. Please try again or email bianca@enderlin.info.';
        $('err2').style.display = '';
      });
  });
})();
</script>
</main>
</body>
</html>
